edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom.debian10    # 使用预装 Node.js 的 Debian 10 环境
      code: ./
      environmentVariables:
        PORT: "9000"
        HOST: "0.0.0.0"
      customRuntimeConfig:
        command:
          - /code/scf_bootstrap   # 直接执行我们的启动脚本，不要带 bash -c
        port: 9000
        healthCheckConfig:
          httpGetUrl: /
          initialDelaySeconds: 10 # 给应用留出启动时间
          periodSeconds: 10
          timeoutSeconds: 3       # 核心修复：必须 <= 3
          failureThreshold: 3
      memorySize: 512             # 规避 Disk 必填报错
      timeout: 30
      minInstance: 0
      maxInstance: 5
      instanceConcurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
