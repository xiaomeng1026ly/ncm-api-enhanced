edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom.debian10    # 核心修改：使用预装 Node.js 的 Debian 10 环境
      code: ./
      environmentVariables:
        PORT: "9000"              # 告诉 Node 项目监听 9000 端口
        HOST: "0.0.0.0"           # 必须绑定 0.0.0.0 允许公网访问
      customRuntimeConfig:
        command:
          - /code/scf_bootstrap
        port: 9000                # FC 健康检查端口
        healthCheckConfig:        # 配置健康检查，探测根路径
          httpGetUrl: /
          initialDelaySeconds: 10 # 网易云 API 启动稍慢，给 10 秒缓冲
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      memorySize: 512             # 只留这个，规避 Disk 必填报错
      timeout: 30
      minInstance: 0
      maxInstance: 5
      instanceConcurrency: 20     # 修正：正确的并发字段名
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
