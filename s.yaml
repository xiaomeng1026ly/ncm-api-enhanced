edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: nodejs20
      code: ./
      webConfig:
        port: 9000
        startCommand: npm install && node app.js
      memorySize: 256
      cpu: 0.15
      timeout: 10
      minInstance: 0
      maxInstance: 5
      concurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
