edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom.debian10
      code: ./
      environmentVariables:
        PORT: "9000"
        HOST: "0.0.0.0"
      customRuntimeConfig:
        command:
          - /code/scf_bootstrap
        port: 9000
        healthCheckConfig:
          httpGetUrl: /
          initialDelaySeconds: 60      # 核心修改：等待 60 秒再开始健康检查
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 10         # 核心修改：允许失败 10 次
      memorySize: 512
      timeout: 120                     # 核心修改：单次执行超时时间放宽到 120 秒
      minInstance: 0
      maxInstance: 5
      instanceConcurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
