edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom
      code: ./
      environmentVariables:
        FC_SERVER_PORT: "9000"
        HOST: "0.0.0.0"
      customRuntimeConfig:
        command:
          - /code/scf_bootstrap
        port: 9000
        healthCheckConfig:
          httpGetUrl: /healthz
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      memorySize: 512
      timeout: 30
      minInstance: 0
      maxInstance: 5
      instanceConcurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
