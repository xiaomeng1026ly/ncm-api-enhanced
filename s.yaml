edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: nodejs20
      code: ./
      webConfig:
        port: 9000
        # 拆分命令，增加失败容错，优先锁定国内npm源，解决国外包拉取超时
        startCommand: npm config set registry https://registry.npmmirror.com && npm install --production && node app.js
      memorySize: 512
      cpu: 0.25
      timeout: 15
      minInstance: 0
      maxInstance: 5
      concurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
