edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hongkong   # 【核心修改】改为香港地域，彻底免备案
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom.debian10
      code: ./
      environmentVariables:
        PORT: "9000"
        HOST: "0.0.0.0"
      customRuntimeConfig:
        command:
          - /code/scf_bootstrap
        port: 9000
        healthCheckConfig:
          httpGetUrl: /
          initialDelaySeconds: 60      # 给云端安装依赖预留 60 秒
          periodSeconds: 10
          timeoutSeconds: 3            # 阿里云限制最大为 3
          failureThreshold: 10
      memorySize: 512                  # 保持单填，规避 Disk 报错
      timeout: 120                     # 放宽超时时间至 120 秒
      minInstance: 0
      maxInstance: 5
      instanceConcurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
