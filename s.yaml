edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom.debian10
      code: ./
      environmentVariables:
        PORT: "9000"
        HOST: "0.0.0.0"
      customRuntimeConfig:
        # 【关键】这里只能有 /code/scf_bootstrap，不要有任何 bash -c 或 npm install
        command:
          - /code/scf_bootstrap
        port: 9000
        healthCheckConfig:
          httpGetUrl: /
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3       # 【关键】必须是 1~3 之间的数字，这里写 3
          failureThreshold: 3
      memorySize: 512
      timeout: 30
      minInstance: 0
      maxInstance: 5
      instanceConcurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
