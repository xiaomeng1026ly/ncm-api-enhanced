edition: 3.0.0
name: ncm-api-enhanced
access: default
vars:
  region: cn-hangzhou
resources:
  ncm-api:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ncm-api-enhanced
      runtime: custom
      code: ./
      environmentVariables:
        PORT: "3000"
        HOST: "0.0.0.0"
      customRuntimeConfig:
        command:
          - /code/scf_bootstrap
        port: 3000
      memorySize: 512
      cpu: 0.25
      timeout: 15
      minInstance: 0
      maxInstance: 5
      concurrency: 20
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
